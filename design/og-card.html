<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>modplayjs — social card</title>
    <!-- Rendered at 1200x630; fonts are read from ../node_modules. -->
    <style>
      @font-face {
        font-family: 'Silkscreen';
        src: url('../node_modules/@fontsource/silkscreen/files/silkscreen-latin-700-normal.woff2')
          format('woff2');
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2')
          format('woff2');
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
        font-display: block;
      }

      :root {
        /* DaisyUI dark, the same palette the playground and the site use. */
        --bg: oklch(21.15% 0.012 254.09);
        --ink: oklch(97.807% 0.029 256.847);
        --primary: oklch(58% 0.233 277.117);
        --line: color-mix(in oklch, var(--ink) 14%, transparent);
      }

      * { box-sizing: border-box; margin: 0; }

      html, body { width: 1200px; height: 630px; }

      body {
        position: relative;
        overflow: hidden;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: var(--bg);
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0 31px,
          color-mix(in oklch, var(--ink) 5%, transparent) 31px 32px
        );
        color: var(--ink);
        font-family: 'Archivo', sans-serif;
      }

      .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 17px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: color-mix(in oklch, var(--ink) 45%, transparent);
      }

      .top .mark {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 18px;
        background: var(--primary);
        vertical-align: middle;
      }

      h1 {
        font-family: 'Silkscreen', monospace;
        font-weight: 700;
        font-size: 118px;
        line-height: 0.92;
        letter-spacing: -0.01em;
      }

      h1 span { color: var(--primary); }

      p.lead {
        margin-top: 28px;
        max-width: 820px;
        font-size: 31px;
        line-height: 1.35;
        color: color-mix(in oklch, var(--ink) 72%, transparent);
      }

      .bottom {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 17px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: color-mix(in oklch, var(--ink) 40%, transparent);
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span><span class="mark"></span>Tracker &amp; chiptune engine</span>
      <span>libxmp · OpenMPT · cRSID</span>
    </div>

    <div>
      <h1>modplay<span>js</span></h1>
      <p class="lead">
        A TypeScript player for tracker modules and chiptunes, verified against the C implementations
        it was ported from.
      </p>
    </div>

    <div class="bottom">
      <span>27 packages · 17 loaders · 31 extensions</span>
      <span>BSD-3-Clause</span>
    </div>
  </body>
</html>
